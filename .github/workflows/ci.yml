name: Windows tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run safe tests without proprietary binaries
        env:
          AVANTAGE_INTEGRATION: "0"
          AVANTAGE_LIVE_WRITE_TEST: "0"
        run: python -m pytest -q
