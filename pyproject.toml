[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avantage-mcp"
version = "1.4.0"
description = "Local MCP server for Thermo Scientific Avantage native spectrum processing"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
avantage-mcp = "avantage_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
